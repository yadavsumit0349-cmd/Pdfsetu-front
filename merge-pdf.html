<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Merge PDF - PDFSetu</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: white;
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .header-content {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 10px;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 20px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            font-size: 32px;
        }

        .description {
            color: #6b7280;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #2563eb;
            border-radius: 15px;
            padding: 40px 20px;
            margin-bottom: 25px;
        }

        .upload-box p {
            margin-bottom: 18px;
            color: #6b7280;
        }

        input[type="file"] {
            display: none;
        }

        .choose-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 12px 22px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .file-list {
            text-align: left;
            margin: 20px 0;
        }

        .file-item {
            background: #f3f4f6;
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 8px;
        }

        .merge-btn {
            border: none;
            background: #16a34a;
            color: white;
            padding: 13px 28px;
            border-radius: 9px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .merge-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        footer {
            text-align: center;
            padding: 30px 15px;
            color: #6b7280;
        }

        footer a {
            color: #2563eb;
            text-decoration: none;
            margin: 0 8px;
        }
    </style>
</head>

<body>

<header>
    <div class="header-content">
        <img src="favicon.png" class="logo" alt="PDFSetu">
        <div class="brand">PDFSetu</div>
    </div>
</header>

<div class="container">

    <a href="index.html" class="back">← Back to PDFSetu</a>

    <div class="card">

        <h1>Merge PDF</h1>

        <p class="description">
            Combine multiple PDF files into one PDF quickly and easily.
        </p>

        <div class="upload-box">

            <p>Select two or more PDF files</p>

            <label for="pdfFiles" class="choose-btn">
                Choose PDF Files
            </label>

            <input
                type="file"
                id="pdfFiles"
                accept=".pdf,application/pdf"
                multiple
            >

        </div>

        <div id="fileList" class="file-list"></div>

        <button
            id="mergeBtn"
            class="merge-btn"
            disabled
            onclick="mergePDFs()">
            Merge & Download
        </button>

        <p id="status"></p>

    </div>

</div>

<footer>

    <a href="about.html">About Us</a>

    <a href="contact.html">Contact Us</a>

    <a href="terms.html">Terms & Conditions</a>

    <p>© 2026 PDFSetu</p>

</footer>

<script>

    const fileInput = document.getElementById("pdfFiles");
    const fileList = document.getElementById("fileList");
    const mergeBtn = document.getElementById("mergeBtn");
    const statusText = document.getElementById("status");

    let selectedFiles = [];

    fileInput.addEventListener("change", function () {

        selectedFiles = Array.from(fileInput.files);

        fileList.innerHTML = "";

        selectedFiles.forEach((file, index) => {

            const item = document.createElement("div");

            item.className = "file-item";

            item.textContent =
                (index + 1) + ". " + file.name;

            fileList.appendChild(item);

        });

        mergeBtn.disabled = selectedFiles.length < 2;

    });


    async function mergePDFs() {

        if (selectedFiles.length < 2) {
            return;
        }

        statusText.textContent = "Merging PDFs...";

        mergeBtn.disabled = true;

        try {

            const formData = new FormData();

            selectedFiles.forEach(file => {
                formData.append("files", file);
            });

            const response = await fetch(
                "https://pdfsetu.onrender.com/api/merge",
                {
                    method: "POST",
                    body: formData
                }
            );

            if (!response.ok) {
                throw new Error("Merge failed");
            }

            const blob = await response.blob();

            const url = window.URL.createObjectURL(blob);

            const a = document.createElement("a");

            a.href = url;

            a.download = "PDFSetu-Merged.pdf";

            document.body.appendChild(a);

            a.click();

            a.remove();

            window.URL.revokeObjectURL(url);

            statusText.textContent =
                "PDF successfully merged and downloaded.";

        } catch (error) {

            console.error(error);

            statusText.textContent =
                "Something went wrong. Please try again.";

        }

        mergeBtn.disabled = false;

    }

</script>

</body>
              </html>
