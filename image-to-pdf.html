<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image to PDF - PDFSetu</title>

    <link rel="icon" type="image/png" href="favicon.png">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        header {
            background: white;
            border-bottom: 1px solid #e5e7eb;
            padding: 15px 20px;
        }

        .header-inner {
            max-width: 1000px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 42px;
            height: 42px;
            border-radius: 10px;
        }

        .brand {
            font-size: 22px;
            font-weight: bold;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            padding: 20px;
        }

        .back {
            color: #2563eb;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 18px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin: 0 0 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #2563eb;
            border-radius: 15px;
            padding: 35px 20px;
            text-align: center;
            margin-bottom: 25px;
        }

        .upload-box p {
            color: #6b7280;
        }

        input[type="file"] {
            display: none;
        }

        .choose-btn {
            display: inline-block;
            background: #2563eb;
            color: white;
            padding: 13px 24px;
            border-radius: 9px;
            cursor: pointer;
            font-weight: bold;
        }

        .preview-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin: 20px 0;
        }

        .preview-item {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 10px;
            background: #fafafa;
        }

        .preview-item img {
            width: 100%;
            height: 180px;
            object-fit: contain;
            border-radius: 8px;
            background: #eee;
        }

        .preview-name {
            font-size: 13px;
            margin-top: 8px;
            word-break: break-word;
        }

        .section {
            margin-top: 25px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .setting {
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .setting label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        select,
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-row label {
            margin: 0;
        }

        .create-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #16a34a;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .create-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        #status {
            text-align: center;
            margin-top: 15px;
        }

        footer {
            text-align: center;
            padding: 30px 15px;
            color: #6b7280;
        }

        footer a {
            color: #2563eb;
            text-decoration: none;
            margin: 0 7px;
        }

        @media (max-width: 600px) {

            .container {
                margin: 20px auto;
                padding: 15px;
            }

            .card {
                padding: 20px;
            }

            h1 {
                font-size: 27px;
            }

            .row {
                grid-template-columns: 1fr;
            }

            .preview-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="header-inner">

        <img src="favicon.png" class="logo" alt="PDFSetu">

        <div class="brand">
            PDFSetu
        </div>

    </div>

</header>


<div class="container">

    <a href="index.html" class="back">
        ← Back to PDFSetu
    </a>


    <div class="card">

        <h1>Image to PDF</h1>

        <p class="subtitle">
            Convert multiple images into one PDF.
        </p>


        <div class="upload-box">

            <p>
                Select one or more images
            </p>

            <label for="imageFiles" class="choose-btn">
                Choose Images
            </label>

            <input
                type="file"
                id="imageFiles"
                accept="image/*"
                multiple
            >

        </div>


        <div id="previewList" class="preview-list"></div>


        <div class="section">

            <div class="section-title">
                PDF Settings
            </div>


            <div class="setting">

                <label for="pageSize">
                    Page Size
                </label>

                <select id="pageSize">

                    <option value="a4">
                        A4
                    </option>

                    <option value="a5">
                        A5
                    </option>

                    <option value="letter">
                        Letter
                    </option>

                    <option value="original">
                        Fit to
